app:
  name: RiceVision-QI
  window_title: "RiceVision-QI: Rice Quality Inspection System"

detection:
  default_type: Rice Defective Kernel Inspection
  min_grain_area: 120
  max_grain_area: 20000
  morph_kernel_size: 5
  local_bright_kernel_size: 41
  max_processing_dimension: 2400
  watershed_enabled: true
  broken_length_ratio: 0.75
  impurity_area_ratio: 0.35
  defective_color_threshold: 34
  pixel_per_mm: null

segmentation:
  backend: opencv_watershed
  method: lab_threshold
  segmentation_method: lab_threshold
  kernel_size: 3
  open_iter: 1
  close_iter: 0
  min_area: 120
  max_area: 100000
  watershed_dist_ratio: 0.20
  fill_holes: false
  max_hole_area: 3000
  hsv_s_min: 0
  hsv_s_max: 70
  hsv_v_min: 120
  lab_l_min: 120
  lab_b_min: 140
  lab_a_min: 120
  lab_a_max: 145
